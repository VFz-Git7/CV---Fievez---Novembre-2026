<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents à télécharger</title>
<style>
  :root { --bg:#f6f5f1; --fg:#1d1d1b; --muted:#6b6a65; --accent:#1f5fbf; --card:#fff; --line:#e3e1da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --fg:#f2f1ec; --muted:#a09f98; --accent:#6ea2f0; --card:#212120; --line:#33332f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:48px 20px; }
  h1 { font-size:1.8rem; margin:0 0 .25rem; }
  p.lead { color:var(--muted); margin:0 0 2rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; display:flex; gap:16px; align-items:center; }
  .card .icon { font-size:2rem; }
  .card .info { flex:1; min-width:0; }
  .card .name { font-weight:600; }
  .card .meta { color:var(--muted); font-size:.875rem; }
  a.btn { background:var(--accent); color:#fff; text-decoration:none; padding:10px 16px; border-radius:10px; font-weight:600; white-space:nowrap; }
  a.btn:focus-visible { outline:3px solid var(--fg); outline-offset:2px; }
  .qr { margin-top:2rem; text-align:center; }
  .qr img { width:200px; height:200px; background:#fff; padding:12px; border-radius:12px; border:1px solid var(--line); }
  .qr p { color:var(--muted); font-size:.875rem; margin:.5rem 0 0; }
</style>
</head>
<body>
<main>
  <h1>Documents à télécharger</h1>
  <p class="lead">Retrouvez ici les documents partagés avec l'équipe.</p>

  <div class="card">
    <div class="icon" aria-hidden="true">📄</div>
    <div class="info">
      <div class="name">CV – Vincent Fievez</div>
      <div class="meta">PDF · mis à jour le 10 novembre 2026</div>
    </div>
    <a class="btn" href="cv-vincent-fievez.pdf" target="_blank" rel="noopener">Télécharger</a>
  </div>

  <div class="qr">
    <img src="qr.png" alt="QR code vers cette page de téléchargement">
    <p>Scannez pour ouvrir cette page et télécharger le document.</p>
  </div>
</main>
</body>
</html>
